quarkus.datasource.db-kind=h2
# quarkus.datasource.jdbc.url=jdbc:h2:mem:employee
quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost:9092/~/employee
quarkus.datasource.username=emp
quarkus.datasource.password=emp
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql
# quarkus.transaction-manager.default-transaction-timeout=70
quarkus.http.root-path=api
quarkus.http.port=8081
